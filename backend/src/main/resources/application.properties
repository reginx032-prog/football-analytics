# Nazwa Twojej aplikacji (opcjonalnie)
spring.application.name=better

# Po??czenie z PostgreSQL w Dockerze
# U?ywamy portu 5433 (zgodnie z Twoim mapowaniem 5433:5432)
# U?ywamy bazy football_data (zgodnie z POSTGRES_DB)
spring.datasource.url=jdbc:postgresql://localhost:5433/football_data

# Dane logowania (zgodnie z Twoim POSTGRES_USER i POSTGRES_PASSWORD)
spring.datasource.username=admin
spring.datasource.password=secret_password

# Driver i Dialekt
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Automatyczne tworzenie tabel na podstawie Twoich klas Java
spring.jpa.hibernate.ddl-auto=none

# Pokazywanie zapyta? SQL w konsoli (pomaga przy debugowaniu)
spring.jpa.show-sql=true
#port
server.port=8081